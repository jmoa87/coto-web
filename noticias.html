<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias · CEI El Coto de los Peques</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --azul:#4A90D9; --azul-claro:#6AABEA; --amarillo:#F5C518; --amarillo-claro:#FDE87C; --gris:#F7F8FC; --gris-texto:#6b7280; --oscuro:#1a2060; }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; height:100%; }
        body { font-family:'Nunito',sans-serif; color:var(--oscuro); background:var(--gris); min-height:100vh; display:flex; flex-direction:column; }

        /* NAV */
        nav { position:fixed; top:0; left:0; right:0; z-index:100; background:rgba(255,255,255,0.96); backdrop-filter:blur(12px); border-bottom:2px solid var(--amarillo); display:flex; align-items:center; justify-content:space-between; padding:0 5%; height:68px; }
        .nav-logo { display:flex; align-items:center; gap:12px; text-decoration:none; }
        .nav-logo img { height:48px; border-radius:50%; }
        .nav-logo span { font-size:18px; font-weight:900; color:var(--azul); line-height:1.1; }
        .nav-logo span em { color:var(--amarillo); font-style:normal; }
        .btn-volver { background:var(--azul); color:white; padding:10px 20px; border-radius:50px; font-weight:800; font-size:14px; text-decoration:none; transition:transform 0.2s; }
        .btn-volver:hover { transform:scale(1.05); }

        /* HEADER */
        .header-noticias { background:var(--azul); padding:100px 5% 60px; text-align:center; position:relative; overflow:hidden; }
        .header-noticias::after { content:''; position:absolute; bottom:-2px; left:-5%; width:110%; height:40px; background:var(--gris); border-radius:50% 50% 0 0/100% 100% 0 0; }
        .header-noticias h1 { font-size:40px; font-weight:900; color:white; margin-bottom:10px; }
        .header-noticias p { font-size:16px; color:rgba(255,255,255,0.75); }

        /* GRID NOTICIAS */
        .noticias-container { max-width:1100px; margin:0 auto; padding:48px 24px 80px; flex:1; width:100%; }
        .noticias-lista { display:grid; grid-template-columns:repeat(3,1fr); gap:28px; }
        .noticia-item { background:white; border-radius:20px; overflow:hidden; box-shadow:0 2px 16px rgba(0,0,0,0.06); cursor:pointer; transition:transform 0.2s, box-shadow 0.2s; border:2px solid transparent; }
        .noticia-item:hover { transform:translateY(-4px); box-shadow:0 8px 32px rgba(74,144,217,0.15); border-color:var(--amarillo); }
        .noticia-img-wrap { height:180px; background:var(--azul); display:flex; align-items:center; justify-content:center; font-size:48px; overflow:hidden; }
        .noticia-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
        .noticia-content { padding:20px; }
        .noticia-fecha { font-size:12px; color:var(--azul-claro); font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        .noticia-content h2 { font-size:16px; font-weight:900; margin-bottom:8px; color:var(--oscuro); line-height:1.3; }
        .noticia-content p { font-size:14px; color:var(--gris-texto); line-height:1.6; }
        .empty-state { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--gris-texto); }
        .empty-state .icon { font-size:48px; margin-bottom:16px; }

        /* FOOTER */
        footer { background:var(--azul); color:rgba(255,255,255,0.8); padding:32px 5%; text-align:center; margin:0; }
        footer p { font-size:14px; margin-bottom:4px; }
        footer a { color:var(--amarillo); text-decoration:none; font-weight:700; }

        /* OVERLAY MODAL */
        #overlay { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.65); align-items:center; justify-content:center; padding:20px; }
        #overlay.abierto { display:flex; }
        #overlay-caja { background:white; border-radius:24px; width:100%; max-width:640px; max-height:90vh; overflow-y:auto; position:relative; box-shadow:0 24px 80px rgba(0,0,0,0.35); animation:aparecer 0.3s cubic-bezier(0.34,1.4,0.64,1); }
        @keyframes aparecer { from { opacity:0; transform:scale(0.92) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
        #overlay-img-wrap img { width:100%; max-height:340px; object-fit:cover; border-radius:24px 24px 0 0; display:block; }
        #overlay-emoji { background:var(--azul); height:200px; border-radius:24px 24px 0 0; display:flex; align-items:center; justify-content:center; font-size:80px; }
        #overlay-body { padding:28px 32px 36px; }
        #overlay-fecha { font-size:12px; color:var(--azul-claro); font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
        #overlay-titulo { font-size:24px; font-weight:900; color:var(--oscuro); margin-bottom:16px; line-height:1.3; }
        #overlay-texto { font-size:15px; color:#555; line-height:1.9; white-space:pre-line; }
        #overlay-cerrar { position:absolute; top:14px; right:14px; width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; background:rgba(0,0,0,0.45); color:white; font-size:20px; display:flex; align-items:center; justify-content:center; transition:transform 0.2s, background 0.2s; z-index:10; }
        #overlay-cerrar:hover { transform:rotate(90deg); background:rgba(0,0,0,0.75); }

        /* RESPONSIVE */
        @media (max-width:900px) { .noticias-lista { grid-template-columns:repeat(2,1fr); } }
        @media (max-width:580px) { .noticias-lista { grid-template-columns:1fr; } .header-noticias h1 { font-size:28px; } #overlay-body { padding:20px; } #overlay-titulo { font-size:20px; } }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo">
        <img src="icon.jpg" alt="Logo">
        <span>El Coto de <em>los Peques</em></span>
    </a>
    <a href="index.html" class="btn-volver">← Volver al inicio</a>
</nav>

<div class="header-noticias">
    <h1>📰 Noticias</h1>
    <p>Todas las novedades de CEI El Coto de los Peques</p>
</div>

<div class="noticias-container">
    <div class="noticias-lista" id="listaNoticias">
        <div class="empty-state"><div class="icon">⏳</div>Cargando noticias…</div>
    </div>
</div>

<footer>
    <p>© 2026 CEI El Coto de los Peques · Alcalá la Real, Jaén</p>
    <p style="margin-top:8px;"><a href="index.html">← Volver al inicio</a> · <a href="cookies.html">Política de cookies</a></p>
</footer>

<!-- OVERLAY -->
<div id="overlay" onclick="if(event.target===this)cerrar()">
    <div id="overlay-caja">
        <button id="overlay-cerrar" onclick="cerrar()">✕</button>
        <div id="overlay-img-wrap"></div>
        <div id="overlay-body">
            <div id="overlay-fecha"></div>
            <div id="overlay-titulo"></div>
            <div id="overlay-texto"></div>
        </div>
    </div>
</div>

<script>
var SUPA_URL = 'https://kcshvhekcofydsaoxgyn.supabase.co';
var SUPA_KEY = 'sb_publishable_KVE7FKtabvpRwXnheCHIJw_xP0aoRxP';
var HDRS = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY };

function abrir(titulo, texto, imagen_url, fecha) {
    var wrap = document.getElementById('overlay-img-wrap');
    if (imagen_url) {
        wrap.innerHTML = '<img src="' + imagen_url + '" alt="' + titulo + '">';
    } else {
        wrap.innerHTML = '<div id="overlay-emoji">📰</div>';
    }
    document.getElementById('overlay-fecha').textContent = fecha;
    document.getElementById('overlay-titulo').textContent = titulo;
    document.getElementById('overlay-texto').textContent = texto;
    document.getElementById('overlay').classList.add('abierto');
    document.body.style.overflow = 'hidden';
}

function cerrar() {
    document.getElementById('overlay').classList.remove('abierto');
    document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') cerrar();
});

async function cargarNoticias() {
    var lista = document.getElementById('listaNoticias');
    try {
        var r = await fetch(SUPA_URL + '/rest/v1/noticias_coto?order=fecha.desc', { headers: HDRS });
        var noticias = await r.json();
        if (!noticias || noticias.length === 0) {
            lista.innerHTML = '<div class="empty-state"><div class="icon">📭</div>Todavía no hay noticias publicadas.</div>';
            return;
        }
        var html = '';
        for (var i = 0; i < noticias.length; i++) {
            var n = noticias[i];
            var fecha = new Date(n.fecha).toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
            var imgHtml = n.imagen_url
                ? '<div class="noticia-img-wrap"><img src="' + n.imagen_url + '" alt="' + n.titulo + '"></div>'
                : '<div class="noticia-img-wrap">📰</div>';
            var textoCorto = n.texto.length > 120 ? n.texto.slice(0,120) + '…' : n.texto;
            var t = JSON.stringify(n.titulo);
            var x = JSON.stringify(n.texto);
            var im = JSON.stringify(n.imagen_url || '');
            var f = JSON.stringify(fecha);
            html += '<div class="noticia-item" onclick="abrir(' + t + ',' + x + ',' + im + ',' + f + ')">'
                + imgHtml
                + '<div class="noticia-content">'
                + '<div class="noticia-fecha">' + fecha + '</div>'
                + '<h2>' + n.titulo + '</h2>'
                + '<p>' + textoCorto + '</p>'
                + '</div></div>';
        }
        lista.innerHTML = html;
    } catch(e) {
        lista.innerHTML = '<div class="empty-state"><div class="icon">❌</div>No se pudieron cargar las noticias.</div>';
        console.error(e);
    }
}

cargarNoticias();
</script>
</body>
</html>
